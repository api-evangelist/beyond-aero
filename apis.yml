aid: beyond-aero
name: Beyond Aero
description: 'Beyond Aero is a French aerospace company building the world''s first
  electric business aircraft powered by hydrogen propulsion. Its flagship aircraft,
  "One", is designed to fly more than 800 nautical miles with zero in-flight carbon
  emissions, targeting the light business-jet market. The company pairs rapid prototyping
  and iterative aircraft design with in-house engineering tools such as HADES (Hydrogen
  Aircraft Data Exploration Software). Backed by Initialized Capital, Beyond Aero is
  a frontier-tech hardware startup rather than an API provider; it publishes no public
  developer API, SDKs, or machine-readable API surface at this time. This profile was
  surfaced from a VC portfolio and enriched with company identity and web/domain-security
  signals.'
